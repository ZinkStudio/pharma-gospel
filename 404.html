<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Redirection…</title>
  <script>
    // Nombre de segments de chemin à conserver pour retrouver la racine du site.
    // 0 = site servi à la racine du domaine (ex: https://mondomaine.fr/)
    // 1 = site servi dans un sous-dossier (ex: https://user.github.io/pharma-gospel/)
    var ROOT_SEGMENTS_TO_KEEP = 1;

    var segments = location.pathname.split('/').filter(Boolean);
    var rootSegments = segments.slice(0, ROOT_SEGMENTS_TO_KEEP);
    var routeSegments = segments.slice(ROOT_SEGMENTS_TO_KEEP);

    var basePath = '/' + rootSegments.join('/') + (rootSegments.length ? '/' : '');
    var route = routeSegments.join('/') + location.search + location.hash;

    window.location.replace(basePath + 'index.html#' + route);
  </script>
</head>

<body>
  <p>Redirection…</p>
</body>

</html>
