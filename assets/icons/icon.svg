<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PharmaCodex" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PharmaCodex</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fa97b"/>
      <stop offset="0.5" stop-color="#027A4E"/>
      <stop offset="1" stop-color="#02553a"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="500" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a06f"/>
      <stop offset="1" stop-color="#056443"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dc92"/>
      <stop offset="1" stop-color="#c79d3f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Demi-livre ouvert (moitié gauche) : silhouette blanche -->
    <path id="half-sil" d="M512 448 C468 402 384 352 256 316 C236 340 228 360 226 376 C214 470 160 590 96 664 C236 640 408 642 470 664 C488 672 500 688 512 690 Z"/>

    <!-- Silhouette complète (croix) utilisée pour la lueur -->
    <g id="sil" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round">
      <rect x="368" y="108" width="288" height="800" rx="26"/>
      <use xlink:href="#half-sil"/>
      <use xlink:href="#half-sil" transform="matrix(-1 0 0 1 1024 0)"/>
    </g>

    <!-- Détails du demi-livre (gauche) -->
    <g id="half-detail" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- couverture visible derrière -->
      <path d="M214 380 L136 380 Q124 380 124 392 L112 628 Q110 646 128 646 L170 646 L214 560 Z" fill="#0a7a52" stroke="#fff" stroke-width="12"/>
      <path d="M214 400 L152 400 L142 616" stroke="#fff" stroke-opacity=".55" stroke-width="5"/>
      <!-- page blanche -->
      <use xlink:href="#half-sil" fill="#fff" stroke="none"/>
      <!-- lignes de texte -->
      <g stroke="#8fc2ab" stroke-width="4.5">
        <path d="M398 394 L494 450"/><path d="M398 410 L494 466"/>
        <path d="M398 426 L494 482"/><path d="M398 442 L494 498"/>
        <path d="M398 458 L494 514"/><path d="M398 474 L494 530"/>
        <path d="M398 490 L494 546"/>
      </g>
      <!-- pli de la page -->
      <path d="M380 372 L368 500" stroke="#8fc2ab" stroke-width="3.5"/>
      <!-- ornements -->
      <g stroke="#1f8f66" stroke-width="7">
        <path d="M292 392 C262 394 258 430 284 438 C306 444 322 424 308 410 C298 400 282 410 290 420"/>
        <path d="M324 398 C338 386 360 392 358 412"/>
        <path d="M232 520 C246 506 276 508 288 524 C298 536 318 538 332 526"/>
        <path d="M250 534 C262 546 282 548 296 542"/>
      </g>
      <!-- tranches de pages -->
      <path d="M222 462 C300 520 430 540 506 636" stroke="#0a7a52" stroke-width="9"/>
      <path d="M222 478 C300 534 430 554 504 648" stroke="url(#gold)" stroke-width="3.5"/>
      <path d="M152 600 C280 574 430 592 496 650" stroke="#0a7a52" stroke-width="9"/>
    </g>
  </defs>

  <!-- Fond -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#halo)"/>

  <!-- Lueur diffuse autour de la croix -->
  <g filter="url(#glow)" opacity="0.85"><use xlink:href="#sil"/></g>

  <!-- Colonne de la croix : pile de livres -->
  <rect x="368" y="108" width="288" height="800" rx="26" fill="#fff"/>
  <rect x="382" y="122" width="260" height="772" rx="16" fill="#0a7a52"/>

  <!-- Livres du haut -->
  <g>
    <!-- livre tranche -->
    <rect x="390" y="134" width="244" height="56" rx="10" fill="#fff" stroke="#04573a" stroke-width="5"/>
    <rect x="400" y="143" width="226" height="38" rx="5" fill="#eef7f2"/>
    
    <rect x="390" y="134" width="26" height="56" rx="10" fill="url(#spine)" stroke="#04573a" stroke-width="5"/>
    <path d="M432 150 H614 M432 162 H614 M432 174 H600" stroke="#9cc9b6" stroke-width="3" stroke-linecap="round"/>

    <rect x="390" y="198" width="244" height="56" rx="10" fill="url(#spine)"/>
    <path d="M426 206 V246 M434 206 V246 M590 206 V246 M598 206 V246" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M404 208 V244" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

    <rect x="390" y="262" width="244" height="56" rx="10" fill="url(#spine)"/>
    <path d="M426 270 V310 M434 270 V310 M590 270 V310 M598 270 V310" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M404 272 V308" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Livres du bas -->
  <g>
    <rect x="390" y="706" width="244" height="56" rx="10" fill="url(#spine)"/>
    <path d="M426 714 V754 M434 714 V754 M590 714 V754 M598 714 V754" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M404 716 V752" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

    <rect x="390" y="770" width="244" height="56" rx="10" fill="#fff" stroke="#04573a" stroke-width="5"/>
    <rect x="400" y="779" width="226" height="38" rx="5" fill="#eef7f2"/>
    
    <rect x="390" y="770" width="26" height="56" rx="10" fill="url(#spine)" stroke="#04573a" stroke-width="5"/>
    <path d="M432 786 H614 M432 798 H614 M432 810 H600" stroke="#9cc9b6" stroke-width="3" stroke-linecap="round"/>

    <rect x="390" y="834" width="244" height="56" rx="10" fill="url(#spine)"/>
    <path d="M426 842 V882 M434 842 V882 M590 842 V882 M598 842 V882" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M404 844 V880" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Livre ouvert : silhouette (contour blanc) puis détails -->
  <g fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round">
    <use xlink:href="#half-sil"/>
    <use xlink:href="#half-sil" transform="matrix(-1 0 0 1 1024 0)"/>
  </g>
  <use xlink:href="#half-detail"/>
  <use xlink:href="#half-detail" transform="matrix(-1 0 0 1 1024 0)"/>

  <!-- Reliure centrale + petit creux -->
  <path d="M512 452 V646" stroke="#0a7a52" stroke-width="5" stroke-linecap="round"/>
  <path d="M484 664 C498 672 504 676 512 676 C520 676 526 672 540 664" fill="none" stroke="#0a7a52" stroke-width="5" stroke-linecap="round"/>
</svg>
